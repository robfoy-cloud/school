<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6b4f">
<meta name="apple-mobile-web-app-title" content="School">
<style>
  :root {
    --bg: #f5f3ec;
    --panel: #ffffff;
    --ink: #1f2a24;
    --muted: #6b766f;
    --line: #e2ded2;
    --green: #2f6b4f;
    --green-soft: #e3efe7;
    --amber: #b7791f;
    --amber-soft: #fbf0dc;
    --red: #b4423a;
    --red-soft: #f8e3e1;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select { font: inherit; }
  .hidden { display: none !important; }

  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  header .logo { border-radius: 8px; display: block; margin-right: -4px; }
  header .school { color: var(--muted); font-size: 14px; }
  header .spacer { flex: 1; }
  .acting { font-size: 13px; background: var(--green-soft); color: var(--green); padding: 5px 10px; border-radius: 999px; }
  .btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 999px; }
  .btn:hover { border-color: var(--green); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .btn.small { padding: 5px 11px; font-size: 13px; }

  main { padding: 16px 20px 60px; max-width: 1400px; margin: 0 auto; }
  h2 { margin: 0 0 6px; font-size: 20px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  /* Login + act-as */
  .card-panel { max-width: 380px; margin: 8vh auto; background: var(--panel); padding: 26px;
    border-radius: var(--radius); border: 1px solid var(--line); }
  .card-panel p { color: var(--muted); margin: 0 0 16px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .card-panel .btn.primary { width: 100%; margin-top: 16px; padding: 11px; }
  .card-panel .btn.google { background: #fff; color: var(--ink); border-color: var(--line);
    display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
  .card-panel .btn.google:hover { border-color: var(--green); }
  details.pw { margin-top: 14px; }
  details.pw summary { color: var(--muted); font-size: 13px; cursor: pointer; }
  .error { color: var(--red); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .actas { max-width: 760px; margin: 4vh auto; }
  .actas-row { display: flex; gap: 8px; margin: 10px 0 20px; }
  .actas-row .field { max-width: 160px; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-bottom: 18px; }
  .person { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .person:hover { border-color: var(--green); }
  .person .id { color: var(--muted); font-size: 12px; float: right; }
  .group-title { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0; }

  /* Tabs + summary */
  .steps { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .step { border: 1px solid var(--line); background: var(--panel); padding: 9px 16px; border-radius: 999px; }
  .step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 600; margin-right: 6px; }
  .step.active { background: var(--green); color: #fff; border-color: var(--green); }
  .step.active .n { background: #fff; }
  .summary { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .summary b { color: var(--ink); }
  .summary .done b { color: var(--green); }

  /* Boards */
  .board { display: grid; gap: 12px; align-items: start; }
  .years-board { grid-template-columns: repeat(var(--cols), minmax(150px, 1fr)); overflow-x: auto; padding-bottom: 6px; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
  .col-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .col-head h3 { margin: 0; font-size: 15px; }
  .col-head .sub { color: var(--muted); font-size: 12px; }
  .col-head .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .col-head .count.full { color: var(--red); font-weight: 600; }
  .col.muted { background: #faf9f5; }
  .list { padding: 8px; min-height: 80px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .card { display: flex; align-items: center; gap: 9px; }
  .card .txt { min-width: 0; flex: 1; }
  .avatar { width: var(--s); height: var(--s); border-radius: 50%; object-fit: cover; flex: none;
    display: inline-grid; place-items: center; font-size: calc(var(--s) * .38); font-weight: 600; color: #fff;
    vertical-align: middle; -webkit-user-drag: none; }
  .who-cell { display: flex; align-items: center; gap: 10px; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .photo-tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 10px 10px;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .photo-tile .nm { font-weight: 500; font-size: 14px; line-height: 1.2; }
  .photo-tile .rl { font-size: 12px; color: var(--muted); margin-top: -4px; }
  .photo-tile .acts { display: flex; gap: 6px; margin-top: 2px; }
  .photo-tile.busy { opacity: .5; pointer-events: none; }
  .card .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 999px; }
  .tag.amber { background: var(--amber-soft); color: var(--amber); }
  .tag.red { background: var(--red-soft); color: var(--red); }
  .tag.green { background: var(--green-soft); color: var(--green); }
  .sortable-ghost { opacity: .35; }
  .sortable-chosen { box-shadow: 0 6px 18px rgba(0,0,0,.12); }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .pill { border: 1px solid var(--line); background: var(--panel); padding: 6px 14px; border-radius: 999px; }
  .pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar .spacer { flex: 1; }

  .staff-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
  .pools { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 70px; max-height: calc(100vh - 90px); overflow: auto; }
  .class-grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 12px; }
  .class-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .class-card h4 { margin: 0 0 8px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
  .class-card h4 .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .slot-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 3px; }
  .slot { min-height: 40px; border: 1.5px dashed var(--line); border-radius: 8px; padding: 3px; }
  .slot:empty::before { content: attr(data-placeholder); display: block; color: #b0b6b1; font-size: 13px; padding: 8px; }
  .slot .card { border-color: var(--green-soft); background: var(--green-soft); }
  .pool .list { min-height: 60px; }

  /* Tables */
  .table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .table th, .table td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .table th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: #faf9f5; }
  .table tr:last-child td { border-bottom: none; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .add-form { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 18px; align-items: end; }
  .add-form .field { width: auto; flex: 1; min-width: 120px; }

  /* Register */
  .reg-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .reg-head .field { width: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 7px 14px; }
  .seg button.on { background: var(--ink); color: #fff; }
  .reg-row td:last-child { text-align: right; white-space: nowrap; }
  .mark { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; margin-left: 4px; min-width: 84px; }
  .mark.on.present { background: var(--green); border-color: var(--green); color: #fff; }
  .mark.on.late { background: var(--amber); border-color: var(--amber); color: #fff; }
  .mark.on.absent { background: var(--red); border-color: var(--red); color: #fff; }
  .status { font-size: 13px; padding: 2px 9px; border-radius: 999px; }
  .status.present { background: var(--green-soft); color: var(--green); }
  .status.late { background: var(--amber-soft); color: var(--amber); }
  .status.absent { background: var(--red-soft); color: var(--red); }
  .status.none { color: var(--muted); }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }

  .no-contact { display: block; margin-top: 12px; font-size: 14px; }
  .no-contact input { margin-right: 6px; }
  .field:disabled { background: #faf9f5; color: var(--ink); }
  .table a { color: var(--green); }

  /* Homework */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 140px; }
  textarea.field { resize: vertical; font: inherit; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; }
  .hw-list { display: grid; gap: 10px; }
  .hw-card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .hw-card:hover { border-color: var(--green); }
  .hw-top { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .hw-meta { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .q-edit { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; align-items: flex-start; }
  .q-num { width: 28px; height: 28px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; font-weight: 600; flex: none; }
  .q-body { flex: 1; min-width: 0; }
  .q-list { margin: 10px 0 0; padding-left: 22px; }
  .q-list li { margin: 3px 0; }
  .sticky-actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; margin: 0; border-top: 1px solid var(--line); }
  .review td { vertical-align: top; }
  .review tr.flagged td { background: #fff8e6; }
  .conf { font-size: 12px; color: var(--muted); }
  .conf.low { color: var(--amber); font-weight: 600; }
  .tick { border: 1px solid var(--line); background: #fff; border-radius: 8px; width: 40px; height: 34px; margin-left: 3px; font-size: 16px; }
  .tick.on.yes { background: var(--green); border-color: var(--green); color: #fff; }
  .tick.on.no { background: var(--red); border-color: var(--red); color: #fff; }
  .score-big { font-size: 26px; font-weight: 700; color: var(--green); }
  .ai-summary { background: var(--green-soft); border-radius: 8px; padding: 10px 12px; margin: 12px 0 0; font-size: 14px; }
  .consistency { background: var(--amber-soft); color: #7a5112; border-radius: 8px; padding: 10px 12px; margin: 10px 0 0; font-size: 14px; }
  .photos { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .photos img { height: 180px; border-radius: 8px; border: 1px solid var(--line); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #faf9f5; }
  .bar-row { display: grid; grid-template-columns: 1fr 2fr 50px; gap: 10px; align-items: center; margin: 6px 0; font-size: 14px; }
  .bar { background: #eee; border-radius: 999px; height: 10px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--green); }
  .bar span.low { background: var(--red); }
  a.btn { text-decoration: none; color: inherit; display: inline-block; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20; max-width: 90vw; }
  .toast.error { background: var(--red); }

  @media (max-width: 900px) {
    .staff-layout, .two-col { grid-template-columns: 1fr; }
    .pools { position: static; max-height: none; flex-direction: row; }
    .pools .col { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <img src="/icon.svg" alt="" width="32" height="32" class="logo">
  <h1>School</h1>
  <span class="school" id="schoolName"></span>
  <span class="spacer"></span>
  <span class="acting hidden" id="acting"></span>
  <button class="btn small hidden" id="switchStaff">Switch staff</button>
  <button class="btn small hidden" id="signOut">Sign out</button>
</header>

<section class="card-panel hidden" id="login">
  <h2>Sign in</h2>
  <p>Developer sign-in. After this you can act as any staff member.</p>
  <button class="btn primary google" id="googleSignIn" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Sign in with Google
  </button>
  <div class="error" id="googleError"></div>
  <details class="pw">
    <summary>Use email and password instead</summary>
  <form id="loginForm">
    <label class="f" for="email">Email</label>
    <input class="field" id="email" type="email" autocomplete="username" required>
    <label class="f" for="password">Password</label>
    <input class="field" id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  </details>
  <div class="error" id="loginError"></div>
</section>

<section class="actas hidden" id="actas">
  <h2>Act as a staff member</h2>
  <p class="hint">Test login: enter a staff ID or pick someone. You'll see exactly what they're allowed to see.</p>
  <form class="actas-row" id="actasForm">
    <input class="field" id="actasId" type="number" min="1" placeholder="Staff ID" required>
    <button class="btn primary" type="submit">Log in as</button>
  </form>
  <div class="error" id="actasError"></div>
  <div id="peopleList"></div>
</section>

<main class="hidden" id="app"></main>

<div class="toast hidden" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://veoxasldburbztzucyrn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Gwnaqzgzz-Abvn5hiQvhsw_32P5goIo'; // public key; data is protected by row-level security
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const MAX_PER_CLASS = 30;
const YEARS = [0, 1, 2, 3, 4, 5, 6];
const TEACHER_ROLES = ['teacher', 'head_of_key_stage', 'deputy_headteacher'];
const TA_ROLES = ['teaching_assistant'];
const ROLE_NAMES = {
  la_admin: 'LA admin', headteacher: 'Headteacher', deputy_headteacher: 'Deputy headteacher',
  head_of_key_stage: 'Head of key stage', teacher: 'Teacher', teaching_assistant: 'Teaching assistant',
};

const state = { me: null, pupils: [], classes: [], staff: [], tab: 'years', classYear: 1, photoGroup: 'staff',
  classTab: 'register', hwView: null, homework: [], submissions: [], questions: [], answers: [], progressPupil: null,
  regDate: todayISO(), regSession: new Date().getHours() < 12 ? 'AM' : 'PM', regClass: null, attendance: [] };
let sortables = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const roleName = (r) => ROLE_NAMES[r] ?? r ?? '';
const yearLabel = (y) => (y === 0 ? 'Reception' : `Year ${y}`);
const fmtDate = (d) => (d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '');
const pupilName = (p) => `${p.first_name ?? ''} ${p.last_name ?? ''}`.trim();
const staffName = (s) => `${s.salutation ? s.salutation + ' ' : ''}${s.second_name ?? ''}`.trim();
const classById = (id) => state.classes.find((c) => c.class_id === id);
const staffById = (id) => state.staff.find((s) => s.staff_id === id);
const classLabel = (c) => `${c.year_group}.${c.class}`;
function todayISO() { return new Date().toLocaleDateString('en-CA'); }

function toast(msg, isError = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), isError ? 5000 : 2500);
}

function show(screen) {
  for (const id of ['login', 'actas', 'app']) $(id).classList.toggle('hidden', id !== screen);
  const inApp = screen === 'app';
  $('acting').classList.toggle('hidden', !inApp);
  $('switchStaff').classList.toggle('hidden', !(inApp && state.me?.is_dev_tester));
  $('signOut').classList.toggle('hidden', screen === 'login');
  if (!inApp) $('schoolName').textContent = '';
}

/* ---------- Sign-in and act-as ---------- */

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('login');
  const { data: act } = await sb.from('dev_act_as').select('staff_id').maybeSingle();
  if (act) return enterAs();
  const { data: list } = await sb.rpc('dev_staff_list');
  if (list && list.length) return showActAs(list);
  return enterAs(); // a real staff account without test access
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginError').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) { $('loginError').textContent = error.message; return; }
  start();
});

$('googleSignIn').addEventListener('click', async () => {
  $('googleError').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname },
  });
  if (error) $('googleError').textContent = error.message;
});

$('signOut').addEventListener('click', async () => {
  await sb.from('dev_act_as').delete().not('staff_id', 'is', null);
  await sb.auth.signOut();
  state.me = null;
  show('login');
});

$('switchStaff').addEventListener('click', async () => {
  const { data } = await sb.rpc('dev_staff_list');
  showActAs(data ?? []);
});

function showActAs(list) {
  $('actasError').textContent = '';
  $('actasId').value = '';
  const groups = new Map();
  for (const p of list) {
    if (!groups.has(p.role)) groups.set(p.role, []);
    groups.get(p.role).push(p);
  }
  $('peopleList').innerHTML = [...groups].map(([role, people]) => `
    <div class="group-title">${esc(roleName(role))} · access level ${people[0].access_level}</div>
    <div class="people">${people.map((p) => `
      <button class="person" data-id="${p.staff_id}"><span class="id">#${p.staff_id}</span>${esc(p.name)}</button>`).join('')}

async function actAs(staffId) {

  if (error) { $('actasError').textContent = /foreign key/i.test(error.message) ? `There's no staff member with ID ${staffId}.` : error.message; return; }

async function enterAs() {
  const { data: me, error } = await sb.rpc('school_whoami');
  if (error || !me) {
    show('login');
    $('loginError').textContent = 'This account is not linked to a staff member.';
    return;
  }
  state.me = me;
  state.tab = me.access_level <= 2 ? (me.access_level === 0 ? 'admin' : 'years') : 'class';
  Object.assign(state, { classTab: 'register', hwView: null, progressPupil: null });
  $('acting').textContent = `${staffName(me)} · ${roleName(me.role)} (#${me.staff_id})`;

/* ---------- Data ---------- */

function check(...results) {
  for (const r of results) if (r.error) { toast(r.error.message, true); throw r.error; }
}

async function loadForRole() {
  const lvl = state.me.access_level;
  if (lvl === 0) {
    const [schools, roles] = await Promise.all([
      sb.from('schools').select('school_id, school_short_name, school_name, address').order('school_id'),
      sb.from('roles').select('role_id, role_1, access_level').order('access_level'),
    ]);
    check(schools, roles);
    state.schools = schools.data;
    state.roles = roles.data;
    return;
  }
  // Everyone else: whatever the database lets this person see
  const [pupils, classes, staff] = await Promise.all([
    sb.from('pupils_with_year')
      .select('pupil_id, first_name, last_name, date_of_birth, year_offset, dob_year_group, year_group, class_id, photo_path, '
        + 'contact_1, contact_1_relationship, contact_1_email, contact_1_phone, contact_1_no_contact, '
        + 'contact_2, contact_2_relationship, contact_2_email, contact_2_phone, contact_2_no_contact')
      .order('last_name').order('first_name'),
    sb.from('classes')
      .select('class_id, year_group, class, name, staff_id, ta_staff_id, valid_to')
      .gt('valid_to', new Date().toISOString())
      .order('year_group').order('class'),
    sb.from('staff').select('staff_id, first_name, second_name, salutation, email, photo_path, roles(role_1, access_level)').order('second_name'),
  ]);
  check(pupils, classes, staff);
  state.pupils = pupils.data;
  state.classes = classes.data;
  state.staff = staff.data.map((s) => ({ ...s, role: s.roles?.role_1, level: s.roles?.access_level }));
  if (!state.classes.some((c) => c.year_group === state.classYear) && state.classes.length) state.classYear = state.classes[0].year_group;
  if (!state.classes.some((c) => c.class_id === state.regClass)) state.regClass = state.classes[0]?.class_id ?? null;
  await Promise.all([loadAttendance(), refreshPhotoUrls()]);
}

const PHOTO_BUCKET = 'school-photos';
const photoUrls = new Map(); // storage path -> temporary signed URL

async function refreshPhotoUrls() {
  const paths = [...state.pupils, ...state.staff].map((x) => x.photo_path).filter((p) => p && !photoUrls.has(p));
  if (!paths.length) return;
  const { data, error } = await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths, 6 * 3600);
  if (error) return console.warn(error.message);
  for (const d of data) if (d.signedUrl) photoUrls.set(d.path, d.signedUrl);
}

function avatar(person, size = 28) {
  const url = person.photo_path && photoUrls.get(person.photo_path);
  if (url) return `<img class="avatar" style="--s:${size}px" src="${esc(url)}" alt="" draggable="false">`;
  const isPupil = person.pupil_id != null;
  const look = isPupil ? lookFromName(person.first_name) : lookFromTitle(person.salutation);
  const seed = (isPupil ? 'p' : 's') + (person.pupil_id ?? person.staff_id ?? 0);
  if (FACE_OVERRIDES[seed]?.svg) {
    return `<img class="avatar" style="--s:${size}px" src="data:image/svg+xml;charset=utf-8,${encodeURIComponent(FACE_OVERRIDES[seed].svg)}" alt="" draggable="false">`;
  }
  return `<img class="avatar" style="--s:${size}px" src="${funFace(seed, !isPupil, look, FACE_OVERRIDES[seed])}" alt="" draggable="false">`;
}

  const pick = (a) => a[Math.floor(rnd() * a.length)];

// Square-crop and shrink on the device before uploading
async function toSquareJpeg(file, size = 480) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height);
  const out = Math.min(size, s);
  const c = document.createElement('canvas');
  c.width = c.height = out;
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, out, out);
  return new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.85));
}

async function setPhoto(kind, id, file) {
  const person = kind === 'pupils' ? state.pupils.find((p) => p.pupil_id === id) : staffById(id);
  let newPath = null;
  if (file) {
    const blob = await toSquareJpeg(file);
    newPath = `${kind}/${id}/${Date.now()}.jpg`;
    const up = await sb.storage.from(PHOTO_BUCKET).upload(newPath, blob, { contentType: 'image/jpeg' });
    if (up.error) { toast(up.error.message, true); return false; }
  }
  const { data: oldPath, error } = await sb.rpc('school_set_photo', { kind, target: id, new_path: newPath });
  if (error) {
    toast(error.message, true);
    if (newPath) await sb.storage.from(PHOTO_BUCKET).remove([newPath]);
    return false;
  }
  if (oldPath) { await sb.storage.from(PHOTO_BUCKET).remove([oldPath]); photoUrls.delete(oldPath); }
  person.photo_path = newPath;
  await refreshPhotoUrls();
  return true;
}

async function loadAttendance() {
  if (state.me.access_level === 0 || state.me.access_level === 5) { state.attendance = []; return; }
  const r = await sb.from('attendance').select('pupil_id, status').eq('date', state.regDate).eq('session', state.regSession);
  check(r);
  state.attendance = r.data;
}

async function save(promise) {
  const { error } = await promise;
  if (error) {
    toast(error.message, true);
    await loadForRole();
    render();
    return false;
  }
  return true;
}

/* ---------- Setup actions (heads and deputies) ---------- */

async function movePupilToYear(pupilId, year) {
  const p = state.pupils.find((x) => x.pupil_id === pupilId);
  if (!p || p.year_group === year) return render();
  const offset = year - p.dob_year_group;
  const cls = p.class_id ? classById(p.class_id) : null;
  const classId = cls && cls.year_group === year ? p.class_id : null; // leaving the year means leaving the class
  Object.assign(p, { year_offset: offset, year_group: year, class_id: classId });
  render();
  if (await save(sb.from('pupils').update({ year_offset: offset, class_id: classId }).eq('pupil_id', pupilId))) {
    toast(`${pupilName(p)} moved to ${yearLabel(year)}` + (cls && !classId ? ' and removed from their class' : ''));
  }
}

async function movePupilToClass(pupilId, classId) {
  const p = state.pupils.find((x) => x.pupil_id === pupilId);
  if (!p || p.class_id === classId) return render();
  p.class_id = classId;
  render();
  await save(sb.from('pupils').update({ class_id: classId }).eq('pupil_id', pupilId));
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

async function randomiseYear(year) {
  const classes = state.classes.filter((c) => c.year_group === year);
  const pupils = state.pupils.filter((p) => p.year_group === year);
  if (!classes.length || !pupils.length) return;
  if (pupils.some((p) => p.class_id) && !confirm(`Reallocate all ${pupils.length} pupils in ${yearLabel(year)} at random? This replaces the current class lists.`)) return;

  const groups = new Map(classes.map((c) => [c.class_id, []]));
  const leftOver = [];
  shuffle(pupils).forEach((p, i) => {
    const g = groups.get(classes[i % classes.length].class_id);
    if (g.length < MAX_PER_CLASS) g.push(p.pupil_id); else leftOver.push(p.pupil_id);
  });

  // Clear first so the 30-per-class limit is never tripped part-way through
  if (!(await save(sb.from('pupils').update({ class_id: null }).in('pupil_id', pupils.map((p) => p.pupil_id))))) return;
  for (const [classId, members] of groups) {
    if (members.length && !(await save(sb.from('pupils').update({ class_id: classId }).in('pupil_id', members)))) return;
  }
  for (const p of pupils) p.class_id = null;
  for (const [classId, members] of groups) for (const id of members) state.pupils.find((p) => p.pupil_id === id).class_id = classId;
  render();
  toast(leftOver.length
    ? `Allocated. ${leftOver.length} pupils didn't fit (max ${MAX_PER_CLASS} per class).`
    : `${pupils.length} pupils allocated at random.`, leftOver.length > 0);
}

async function clearYear(year) {
  const pupils = state.pupils.filter((p) => p.year_group === year && p.class_id);
  if (!pupils.length) return;
  if (!confirm(`Take all ${pupils.length} pupils in ${yearLabel(year)} out of their classes?`)) return;
  if (await save(sb.from('pupils').update({ class_id: null }).in('pupil_id', pupils.map((p) => p.pupil_id)))) {
    for (const p of pupils) p.class_id = null;
    render();
  }
}

async function assignStaff(staffId, kind, toClassId, fromClassId) {
  const field = kind === 'teacher' ? 'staff_id' : 'ta_staff_id';
  const updates = [];
  if (fromClassId && fromClassId !== toClassId) {
    classById(fromClassId)[field] = null;
    updates.push(sb.from('classes').update({ [field]: null }).eq('class_id', fromClassId));
  }
  if (toClassId) {
    classById(toClassId)[field] = staffId; // anyone already there goes back to the list
    updates.push(sb.from('classes').update({ [field]: staffId }).eq('class_id', toClassId));
  }
  render();
  for (const u of updates) if (!(await save(u))) return;
}

/* ---------- Register actions (class teachers) ---------- */

async function mark(pupilIds, status) {
  const rows = pupilIds.map((pupil_id) => ({ pupil_id, date: state.regDate, session: state.regSession, status }));
  for (const r of rows) {
    const a = state.attendance.find((x) => x.pupil_id === r.pupil_id);
    if (a) a.status = status; else state.attendance.push({ pupil_id: r.pupil_id, status });
  }
  render();
  await save(sb.from('attendance').upsert(rows, { onConflict: 'pupil_id,date,session' }));
}

/* ---------- Rendering ---------- */

function destroySortables() { sortables.forEach((s) => s.destroy()); sortables = []; }

function sortable(el, opts) {
  sortables.push(Sortable.create(el, {
    animation: 150, delay: 120, delayOnTouchOnly: true,
    ghostClass: 'sortable-ghost', chosenClass: 'sortable-chosen', sort: false,
    ...opts,
  }));
}

function render() {
  destroySortables();
  const lvl = state.me.access_level;
  if (lvl === 0) return renderAdmin();
  if (lvl === 1 || lvl === 2) return renderLeadership();
  if (lvl === 3) return renderKeyStageHead();
  return renderClassView();
}

/* Heads and deputies */
function renderLeadership() {
  const tabs = [['years', 'Year groups'], ['classes', 'Classes'], ['staff', 'Teachers & TAs'], ['pupils', 'Pupils'], ['people', 'Staff'], ['photos', 'Photos'], ['registers', 'Registers']];
  const inClass = state.pupils.filter((p) => p.class_id).length;
  const n = state.classes.length;
  const item = (label, a, b) => `<span class="${a === b ? 'done' : ''}">${label} <b>${a}/${b}</b></span>`;
  $('app').innerHTML = `
    <nav class="steps">${tabs.map(([k, l], i) => `<button class="step ${state.tab === k ? 'active' : ''}" data-tab="${k}">${i < 3 ? `<span class="n">${i + 1}</span>` : ''}${l}</button>`).join('')}</nav>
    <div class="summary">
      ${item('Pupils in a class', inClass, state.pupils.length)}
      ${item('Classes with a teacher', state.classes.filter((c) => c.staff_id).length, n)}
      ${item('Classes with a TA', state.classes.filter((c) => c.ta_staff_id).length, n)}
    </div>
    <div id="view"></div>`;
  $('app').querySelectorAll('.step').forEach((b) => b.addEventListener('click', () => { state.tab = b.dataset.tab; state.pupilEdit = null; render(); }));
  ({ years: renderYears, classes: renderClasses, staff: renderStaffAssign, pupils: renderPupilsAdmin, people: renderPeople, photos: renderPhotos, registers: renderRegisters })[state.tab]();
}

/* ---------- Pupil details ---------- */

function renderPupilsAdmin() {
  if (state.pupilEdit) return renderPupilForm(true);
  const q = (state.pupilSearch || '').toLowerCase();
  const yf = state.pupilYear ?? 'all';
  const list = state.pupils.filter((p) => (yf === 'all' || p.year_group === Number(yf))
    && (!q || `${p.first_name} ${p.last_name}`.toLowerCase().includes(q)
        || (p.contact_1 || '').toLowerCase().includes(q) || (p.contact_2 || '').toLowerCase().includes(q)));
  const years = YEARS.filter((y) => state.pupils.some((p) => p.year_group === y));
  $('view').innerHTML = `
    <div class="toolbar">
      <input class="field" id="pSearch" placeholder="Search pupils or contacts" value="${esc(state.pupilSearch || '')}" style="max-width:280px">
      <button class="pill ${yf === 'all' ? 'active' : ''}" data-y="all">All</button>
      ${years.map((y) => `<button class="pill ${String(yf) === String(y) ? 'active' : ''}" data-y="${y}">${yearLabel(y)}</button>`).join('')}
      <span class="spacer"></span><button class="btn primary small" id="addPupil">Add pupil</button>
    </div>
    <table class="table"><tr><th>Pupil</th><th>Year</th><th>Class</th><th>Contacts</th></tr>
      ${list.map((p) => `<tr class="clickable" data-pid="${p.pupil_id}">
        <td><span class="who-cell">${avatar(p, 30)}${esc(pupilName(p))}</span></td>
        <td>${yearLabel(p.year_group)}</td><td>${esc(classById(p.class_id)?.name ?? '')}</td>
        <td>${[1, 2].map((n) => p[`contact_${n}`] ? `<div>${esc(p[`contact_${n}`])} <span class="hint">${esc(p[`contact_${n}_relationship`] || '')}</span>${p[`contact_${n}_no_contact`] ? ' <span class="tag red">don\'t contact</span>' : ''}</div>` : '').join('')}</td>
      </tr>`).join('') || '<tr><td colspan="4" class="hint">No pupils match.</td></tr>'}

  document.querySelectorAll('tr[data-pid]').forEach((r) => r.addEventListener('click', () => { state.pupilEdit = Number(r.dataset.pid); render(); }));
  $('addPupil').addEventListener('click', () => { state.pupilEdit = 'new'; render(); });

  return `<div class="panel">
    <h4 style="margin-top:0">Contact ${n}</h4>
    <div class="form-row">
      <div><label class="f">Name</label><input class="field" name="contact_${n}" value="${v('')}" ${dis}></div>
      <div><label class="f">Relationship</label><input class="field" name="contact_${n}_relationship" value="${v('_relationship')}" placeholder="e.g. Mother" ${dis}></div>
    </div>
    <div class="form-row">
      <div><label class="f">Email</label><input class="field" type="email" name="contact_${n}_email" value="${v('_email')}" ${dis}></div>
      <div><label class="f">Phone</label><input class="field" type="tel" name="contact_${n}_phone" value="${v('_phone')}" ${dis}></div>
    </div>
    <label class="no-contact"><input type="checkbox" name="contact_${n}_no_contact" ${p[`contact_${n}_no_contact`] ? 'checked' : ''} ${dis}>

async function renderPupilForm(editable) {
  const isNew = state.pupilEdit === 'new';
  let p = { school_id: state.me.school_id, entry_date: new Date().toLocaleDateString('en-CA') };
  if (!isNew) {
    const r = await sb.from('pupils').select('*').eq('pupil_id', state.pupilEdit).single();
    if (r.error) { toast(r.error.message, true); state.pupilEdit = null; return render(); }
    p = r.data;
  }
  const dis = editable ? '' : 'disabled';
  const yearNow = p.date_of_birth ? state.pupils.find((x) => x.pupil_id === p.pupil_id)?.year_group : null;
  $('view').innerHTML = `
    <p><button class="btn small" id="back">← Pupils</button></p>
    <form id="pupilForm">
      <div class="panel">
        <div class="hw-top"><span class="who-cell">${isNew ? '' : avatar(p, 48)}<h3 style="margin:0">${isNew ? 'New pupil' : esc(pupilName(p))}</h3></span>
          ${yearNow != null ? `<span class="tag green">${yearLabel(yearNow)}</span>` : ''}</div>
        <div class="form-row" style="margin-top:8px">
          <div><label class="f">First name</label><input class="field" name="first_name" value="${esc(p.first_name ?? '')}" required ${dis}></div>
          <div><label class="f">Middle name</label><input class="field" name="middle_name" value="${esc(p.middle_name ?? '')}" ${dis}></div>
          <div><label class="f">Last name</label><input class="field" name="last_name" value="${esc(p.last_name ?? '')}" required ${dis}></div>
        </div>
        <div class="form-row">
          <div><label class="f">Date of birth</label><input class="field" type="date" name="date_of_birth" value="${p.date_of_birth ?? ''}" required ${dis}></div>
          <div><label class="f">Started at school</label><input class="field" type="date" name="entry_date" value="${p.entry_date ?? ''}" ${dis}></div>
          <div><label class="f">Left school</label><input class="field" type="date" name="leave_date" value="${p.leave_date ?? ''}" ${dis}></div>
        </div>
      </div>
      <div class="two-col">${contactFields(p, 1, editable)}${contactFields(p, 2, editable)}</div>
      ${editable ? `<div class="toolbar sticky-actions"><span class="spacer"></span>
        <button class="btn" type="button" id="cancel">Cancel</button>
        <button class="btn primary" type="submit">${isNew ? 'Add pupil' : 'Save changes'}</button></div>` : ''}
    </form>`;

  const back = () => { state.pupilEdit = null; render(); };
  $('back').addEventListener('click', back);
  $('cancel')?.addEventListener('click', back);
  $('pupilForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const row = {};
    for (const k of ['first_name', 'middle_name', 'last_name', 'date_of_birth', 'entry_date', 'leave_date',
      'contact_1', 'contact_1_relationship', 'contact_1_email', 'contact_1_phone',
      'contact_2', 'contact_2_relationship', 'contact_2_email', 'contact_2_phone']) row[k] = f[k].value.trim() || null;
    row.contact_1_no_contact = f.contact_1_no_contact.checked;
    row.contact_2_no_contact = f.contact_2_no_contact.checked;
    for (const n of [1, 2]) {
      const ph = row[`contact_${n}_phone`];
      if (ph && !/^\+?[0-9 ()-]{7,20}$/.test(ph)) return toast(`Contact ${n}'s phone number doesn't look right`, true);
      if (ph) row[`contact_${n}_phone`] = ph.replace(/[^\d+]/g, '');
    }
    const res = isNew
      ? await sb.from('pupils').insert({ ...row, school_id: state.me.school_id }).select('pupil_id').single()
      : await sb.from('pupils').update(row).eq('pupil_id', p.pupil_id);
    if (res.error) return toast(res.error.message, true);
    toast(isNew ? `${row.first_name} added` : 'Saved');
    await loadForRole();
    state.pupilEdit = null;
    render();
  });
}

function renderPhotos() {
  const groups = [['staff', 'Staff'], ...YEARS.filter((y) => state.pupils.some((p) => p.year_group === y)).map((y) => [String(y), yearLabel(y)])];
  if (!groups.some(([k]) => k === state.photoGroup)) state.photoGroup = 'staff';
  const g = state.photoGroup;
  const people = g === 'staff'
    ? [...state.staff].sort((a, b) => (a.staff_id === state.me.staff_id ? -1 : b.staff_id === state.me.staff_id ? 1 : a.level - b.level))
        .map((s) => ({ kind: 'staff', id: s.staff_id, person: s, name: staffName(s), sub: s.staff_id === state.me.staff_id ? 'You' : roleName(s.role) }))
    : state.pupils.filter((p) => p.year_group === Number(g))
        .map((p) => ({ kind: 'pupils', id: p.pupil_id, person: p, name: pupilName(p), sub: classById(p.class_id)?.name ?? 'No class' }));
  const missing = (list) => list.filter((x) => !x.photo_path).length;
  const groupMissing = (k) => missing(k === 'staff' ? state.staff : state.pupils.filter((p) => p.year_group === Number(k)));

  $('view').innerHTML = `
    <div class="toolbar">${groups.map(([k, l]) => {
      const m = groupMissing(k);
      return `<button class="pill ${k === g ? 'active' : ''}" data-g="${k}">${l}${m ? ` <span style="opacity:.7">${m} missing</span>` : ' ✓'}</button>`;
    }).join('')}</div>
    <p class="hint">Tap Add to take or choose a photo. Photos are cropped square and shrunk before upload, and only people allowed to see that person can see their photo.</p>
    <input type="file" accept="image/*" id="photoInput" class="hidden">
    <div class="photo-grid">${people.map((x) => `
      <div class="photo-tile" data-kind="${x.kind}" data-id="${x.id}">
        ${avatar(x.person, 84)}
        <div class="nm">${esc(x.name)}</div>
        <div class="rl">${esc(x.sub)}</div>
        <div class="acts">
          <button class="btn small ${x.person.photo_path ? '' : 'primary'}" data-act="add">${x.person.photo_path ? 'Change' : 'Add'}</button>
          ${x.person.photo_path ? '<button class="btn small" data-act="remove">Remove</button>' : ''}
        </div>
      </div>`).join('')}
    </div>`;

  document.querySelectorAll('#view .pill').forEach((b) => b.addEventListener('click', () => { state.photoGroup = b.dataset.g; render(); }));
  const input = $('photoInput');
  let target = null;
  input.addEventListener('change', async () => {
    const file = input.files[0];
    input.value = '';
    if (!file || !target) return;
    target.tile.classList.add('busy');
    if (await setPhoto(target.kind, target.id, file)) toast('Photo saved');
    render();
  });
  document.querySelectorAll('.photo-tile').forEach((tile) => {
    const kind = tile.dataset.kind;
    const id = Number(tile.dataset.id);
    tile.querySelector('[data-act="add"]').addEventListener('click', () => { target = { kind, id, tile }; input.click(); });
    tile.querySelector('[data-act="remove"]')?.addEventListener('click', async () => {
      if (!confirm('Remove this photo?')) return;
      tile.classList.add('busy');
      if (await setPhoto(kind, id, null)) toast('Photo removed');
      render();
    });
  });
}

function pupilCard(p, { showClass = false } = {}) {
  const tags = [];
  if (p.year_offset < 0) tags.push(`<span class="tag amber">held back ${-p.year_offset}</span>`);
  if (p.year_offset > 0) tags.push(`<span class="tag amber">moved up ${p.year_offset}</span>`);
  const cls = p.class_id ? classById(p.class_id) : null;
  if (showClass && cls) tags.push(`<span class="tag green">${esc(cls.name)}</span>`);
  if (cls && cls.year_group !== p.year_group) tags.push(`<span class="tag red">class is ${yearLabel(cls.year_group)}</span>`);
  return `<div class="card" data-id="${p.pupil_id}">${avatar(p, 30)}<div class="txt">
    <div class="name">${esc(pupilName(p))}</div>
    <div class="meta"><span>${fmtDate(p.date_of_birth)}</span>${tags.join('')}</div>
  </div></div>`;
}

function renderYears() {
  const other = state.pupils.filter((p) => !YEARS.includes(p.year_group));
  const cols = YEARS.map((y) => {
    const ps = state.pupils.filter((p) => p.year_group === y);
    return `<div class="col">
      <div class="col-head"><h3>${yearLabel(y)}</h3><span class="count">${ps.length}</span></div>
      <div class="list" data-year="${y}">${ps.map((p) => pupilCard(p, { showClass: true })).join('')}</div>
    </div>`;
  });
  if (other.length) {
    cols.push(`<div class="col muted">
      <div class="col-head"><h3>Outside primary age</h3><span class="count">${other.length}</span></div>
      <div class="list" data-year="other">${other.map((p) => pupilCard(p)).join('')}</div>
    </div>`);
  }
  $('view').innerHTML = `
    <p class="hint">Each pupil starts in the year their date of birth gives them. Drag a pupil to another year to hold them back or move them up.</p>
    <div class="board years-board" style="--cols:${cols.length}">${cols.join('')}</div>`;

  document.querySelectorAll('.years-board .list').forEach((el) => sortable(el, {
    group: { name: 'years', put: (to) => to.el.dataset.year !== 'other' },
    onEnd: (e) => { if (e.from !== e.to) movePupilToYear(Number(e.item.dataset.id), Number(e.to.dataset.year)); },
  }));
}

function renderClasses() {
  const years = [...new Set(state.classes.map((c) => c.year_group))].sort((a, b) => a - b);
  const y = state.classYear;
  const classes = state.classes.filter((c) => c.year_group === y);
  const classIds = new Set(classes.map((c) => c.class_id));
  const unassigned = state.pupils.filter((p) => p.year_group === y && !classIds.has(p.class_id));

  const pills = years.map((yy) => {
    const total = state.pupils.filter((p) => p.year_group === yy).length;
    const placed = state.pupils.filter((p) => p.year_group === yy && p.class_id && classById(p.class_id)?.year_group === yy).length;
    return `<button class="pill ${yy === y ? 'active' : ''}" data-year="${yy}">${yearLabel(yy)} <span style="opacity:.7">${placed}/${total}</span></button>`;
  }).join('');

  const classCols = classes.map((c) => {
    const ps = state.pupils.filter((p) => p.class_id === c.class_id);
    const t = staffById(c.staff_id);
    return `<div class="col">
      <div class="col-head"><h3>${esc(c.name)}</h3><span class="sub">${classLabel(c)}${t ? ' · ' + esc(staffName(t)) : ''}</span>
        <span class="count ${ps.length >= MAX_PER_CLASS ? 'full' : ''}">${ps.length}/${MAX_PER_CLASS}</span></div>
      <div class="list" data-class="${c.class_id}">${ps.map((p) => pupilCard(p)).join('')}</div>
    </div>`;
  }).join('');

  $('view').innerHTML = `
    <div class="toolbar">${pills}<span class="spacer"></span>
      <button class="btn small" id="clearYear">Clear classes</button>
      <button class="btn small primary" id="randomise">Randomly allocate</button>
    </div>
    <p class="hint">Drag pupils between the lists, or randomly allocate the whole year and then swap pupils by hand. Up to ${MAX_PER_CLASS} per class.</p>
    <div class="board" style="grid-template-columns: repeat(${classes.length + 1}, minmax(200px, 1fr))">
      <div class="col muted">
        <div class="col-head"><h3>Not in a class</h3><span class="count">${unassigned.length}</span></div>
        <div class="list" data-class="">${unassigned.map((p) => pupilCard(p)).join('')}</div>
      </div>
      ${classCols}
    </div>`;

  document.querySelectorAll('.toolbar .pill').forEach((b) => b.addEventListener('click', () => { state.classYear = Number(b.dataset.year); render(); }));
  $('randomise').addEventListener('click', () => randomiseYear(y));
  $('clearYear').addEventListener('click', () => clearYear(y));

  document.querySelectorAll('#view .list[data-class]').forEach((el) => sortable(el, {
    group: { name: 'classes', put: (to) => to.el.dataset.class === '' || to.el.querySelectorAll('.card').length < MAX_PER_CLASS },
    onEnd: (e) => {
      if (e.from === e.to) return;
      movePupilToClass(Number(e.item.dataset.id), e.to.dataset.class ? Number(e.to.dataset.class) : null);
    },
  }));
}

function staffCard(s) {
  const note = s.role === 'head_of_key_stage' || s.role === 'deputy_headteacher' ? roleName(s.role) : '';
  return `<div class="card" data-id="${s.staff_id}">${avatar(s, 30)}<div class="txt">
    <div class="name">${esc(staffName(s))}</div>
    <div class="meta"><span>${esc(s.first_name)}</span>${note ? `<span class="tag green">${note}</span>` : ''}</div>
  </div></div>`;
}

function renderStaffAssign() {
  const usedT = new Set(state.classes.map((c) => c.staff_id).filter(Boolean));
  const usedTA = new Set(state.classes.map((c) => c.ta_staff_id).filter(Boolean));
  const teachers = state.staff.filter((s) => TEACHER_ROLES.includes(s.role) && !usedT.has(s.staff_id));

  const slot = (c, kind) => {
    const id = kind === 'teacher' ? c.staff_id : c.ta_staff_id;

    const ph = kind === 'teacher' ? 'Drop a teacher here' : 'Drop a TA here';
    return `<div class="slot" data-kind="${kind}" data-class="${c.class_id}" data-placeholder="${ph}">${s ? staffCard(s) : ''}</div>`;
  };

    <p class="hint">Drag a teacher and a teaching assistant onto each class. Dropping someone onto a filled slot sends the previous person back to the list; drag a person back to the list to remove them.</p>
    <div class="staff-layout">
      <div class="pools">

        <div class="class-card">
          <h4>${esc(c.name)} <span class="sub">${classLabel(c)} · ${yearLabel(c.year_group)}</span></h4>
          <div class="slot-label">Teacher</div>${slot(c, 'teacher')}
          <div class="slot-label">Teaching assistant</div>${slot(c, 'ta')}
        </div>`).join('')}
      </div>
    </div>`;

  document.querySelectorAll('.staff-layout [data-kind]').forEach((el) => sortable(el, {
    group: el.dataset.kind, // teachers only go in teacher slots, TAs only in TA slots
    onEnd: (e) => {

      assignStaff(Number(e.item.dataset.id), e.to.dataset.kind,

    },
  }));
}

/* ======================= Homework (class teachers) ======================= */

const FLAG_CONFIDENCE = 0.8;
const TYPE_LABEL = { number: 'Number', short_text: 'Word or phrase', multiple_choice: 'Multiple choice' };

async function api(path, body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.access_token}` },
    body: JSON.stringify(body),
  });
  const out = await res.json().catch(() => ({ error: `Server error (${res.status})` }));
  if (!res.ok) throw new Error(out.error || `Server error (${res.status})`);
  return out;
}

async function loadHomework(classId) {
  const [hw, subs] = await Promise.all([
    sb.from('homework').select('*').eq('class_id', classId).order('created_at', { ascending: false }),
    sb.from('homework_submissions').select('submission_id, homework_id, pupil_id, token, status, channel, photo_paths, score, max_score, ai_summary, submitted_at'),
  ]);
  check(hw, subs);
  state.homework = hw.data;
  state.submissions = subs.data;
}

async function loadHomeworkDetail(hwId) {
  const [qs, ans] = await Promise.all([
    sb.from('homework_questions').select('*').eq('homework_id', hwId).order('position'),
    sb.from('homework_answers').select('*, homework_submissions!inner(homework_id)').eq('homework_submissions.homework_id', hwId),
  ]);
  check(qs, ans);
  state.questions = qs.data;
  state.answers = ans.data;
}

const familyLink = (token) => `${location.origin}/h.html?t=${token}`;
const pct = (s) => (s.max_score ? Math.round((100 * s.score) / s.max_score) : 0);
const subsFor = (hwId) => state.submissions.filter((s) => s.homework_id === hwId);
const answersFor = (subId) => state.answers.filter((a) => a.submission_id === subId);
const isFlagged = (a) => a.teacher_correct === null && (a.ai_confidence ?? 0) < FLAG_CONFIDENCE;
const STATUS_TEXT = { sent: 'Not handed in', submitted: 'Handed in', marked: 'AI marked', reviewed: 'Marked' };
const STATUS_TAG = { sent: '', submitted: 'amber', marked: 'amber', reviewed: 'green' };

function renderHomework(c, pupils) {
  const v = state.hwView;
  if (v?.mode === 'new') return renderHomeworkNew(c);
  if (v?.mode === 'edit') return renderHomeworkEdit(c);
  if (v?.mode === 'sent') return renderHomeworkSent(c, pupils);
  if (v?.mode === 'review') return renderReview(c, pupils);

  const cards = state.homework.map((h) => {
    const subs = subsFor(h.homework_id);
    const handed = subs.filter((s) => s.status !== 'sent').length;
    const done = subs.filter((s) => s.status === 'reviewed').length;
    const label = h.status === 'draft' ? '<span class="tag amber">Draft</span>' : h.status === 'closed' ? '<span class="tag">Closed</span>' : '<span class="tag green">Sent</span>';
    return `<button class="hw-card" data-hw="${h.homework_id}">
      <div class="hw-top"><b>${esc(h.title)}</b>${label}</div>
      <div class="hint">${esc(h.objective || h.topic || '')}</div>
      <div class="hw-meta">${h.due_date ? `Due ${fmtDate(h.due_date)}` : ''}${h.status !== 'draft' ? ` · Handed in ${handed}/${subs.length} · Marked ${done}` : ''}</div>
    </button>`;
  }).join('');

  $('view').innerHTML = `
    <div class="toolbar"><span class="hint" style="margin:0">Set homework, send it to families, then review the AI's marking.</span><span class="spacer"></span>
      <button class="btn primary" id="newHw">New homework</button></div>
    ${cards ? `<div class="hw-list">${cards}</div>` : '<div class="empty">No homework yet. Tap "New homework" to start.</div>'}`;
  $('newHw').addEventListener('click', () => { state.hwView = { mode: 'new' }; render(); });
  document.querySelectorAll('.hw-card').forEach((b) => b.addEventListener('click', () => openHomework(Number(b.dataset.hw))));
}

async function openHomework(hwId) {
  const classId = state.homework.find((x) => x.homework_id === hwId)?.class_id;
  await Promise.all([loadHomeworkDetail(hwId), classId ? loadHomework(classId) : null]); // pick up new hand-ins
  const h = state.homework.find((x) => x.homework_id === hwId);
  state.hwView = { mode: h.status === 'draft' ? 'edit' : 'sent', hwId };
  render();
}

function renderHomeworkNew(c) {
  const due = new Date(Date.now() + 7 * 864e5).toLocaleDateString('en-CA');
  $('view').innerHTML = `
    <p><button class="btn small" id="back">← All homework</button></p>
    <div class="panel">
      <h3 style="margin-top:0">New homework for ${esc(c.name)} (${yearLabel(c.year_group)})</h3>
      <label class="f">Topic</label>
      <input class="field" id="topic" placeholder="e.g. Equivalent fractions, column addition, telling the time">
      <div class="form-row">
        <div><label class="f">Number of questions</label><input class="field" id="count" type="number" min="1" max="20" value="8"></div>
        <div><label class="f">Due date</label><input class="field" id="due" type="date" value="${due}"></div>
      </div>
      <label class="f">Question types</label>
      <div class="checks">${Object.entries(TYPE_LABEL).map(([k, l]) => `<label><input type="checkbox" value="${k}" ${k !== 'multiple_choice' ? 'checked' : ''}> ${l}</label>`).join('')}</div>
      <label class="f">Notes for the AI (optional)</label>
      <textarea class="field" id="notes" rows="2" placeholder="e.g. include two money word problems; keep numbers under 100"></textarea>
      <div class="toolbar" style="margin-top:16px">
        <button class="btn primary" id="draft">Draft with AI</button>
        <button class="btn" id="blank">Write my own</button>
        <span class="hint" id="drafting" style="margin:0"></span>
      </div>
    </div>`;
  $('back').addEventListener('click', () => { state.hwView = null; render(); });

  const create = async (draft) => {
    const ins = await sb.from('homework').insert({
      class_id: c.class_id, title: draft.title, topic: $('topic').value.trim() || null,
      objective: draft.objective || null, due_date: $('due').value || null,
    }).select().single();
    check(ins);
    if (draft.questions.length) {
      check(await sb.from('homework_questions').insert(draft.questions.map((q) => ({ ...q, homework_id: ins.data.homework_id }))));
    }
    state.homework.unshift(ins.data);
    await openHomework(ins.data.homework_id);
  };

  $('draft').addEventListener('click', async () => {
    const topic = $('topic').value.trim();
    if (!topic) return toast('Add a topic first', true);
    const types = [...document.querySelectorAll('.checks input:checked')].map((x) => x.value);
    $('draft').disabled = true;
    $('drafting').textContent = 'Drafting questions… this takes about 15 seconds.';
    try {
      const draft = await api('/api/generate', { class_id: c.class_id, topic, count: Number($('count').value), types, notes: $('notes').value });
      await create(draft);
      toast('Draft ready. Check the questions and answers before sending.');

      toast(e.message, true);

      $('drafting').textContent = '';

  $('blank').addEventListener('click', async () => {
    const topic = $('topic').value.trim();
    await create({ title: topic || 'Homework', objective: '', questions: [{ position: 1, prompt: '', answer_type: 'number', correct_answer: '', marks: 1 }] });
  });
